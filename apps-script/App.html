<script>
// Receipts' page. Model works out every number; this file only draws them and wires the controls.
var TABS = ['overview', 'now', 'timeline', 'impact', 'outputs', 'streams', 'ideas', 'notes'];
var RECENT = 8;  // the overview lists this many recent shipments; the rest are a click away
var M = null, P = null, STATE = { tab: 'overview', stream: '', status: '', q: '', noteFilter: 'Open', editing: null, fromNote: null };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many || one + 's'); }
function chip(stream) { return '<span class="chip" style="--pc:' + (M.color[stream] || 'var(--muted)') + '">' + esc(stream) + '</span>'; }
function badge(st) { return '<span class="badge ' + (Model.STATUSES.indexOf(st) >= 0 ? st.replace(/ /g, '-') : 'other') + '">' + esc(st) + '</span>'; }
function ago(n) { return n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; }
function wk(mon) { var l = Model.weekLabel(mon); return l.week + ' · ' + l.range; }
/** Links as chips: type, then name; each opens in a new tab. */
function chips(ls) {
  return ls.length ? '<div class="links">' + ls.map(function (l) {
    return '<a class="lnk" href="' + esc(l.url) + '" target="_blank" rel="noopener" title="' + esc(l.url) + '"><b>' + esc(l.type) + '</b>' +
      (l.label !== l.type ? '<span>' + esc(l.label) + '</span>' : '') + '</a>';
  }).join('') + '</div>' : '';
}

/** One log row. opts.impact: show the impact line; opts.notes: show the notes. */
function entry(e, opts) {
  opts = opts || {};
  return '<li class="entry"><div class="when">' + Model.dm(e.date) + '</div><div><div class="what">' + esc(e.item) + '</div>' +
    '<div class="meta">' + chip(e.stream) + badge(e.status) + '<span class="kind">' + esc(e.kind) + (e.project !== e.item ? ' · ' + esc(e.project) : '') +
    (e.who ? ' · for ' + esc(e.who) : '') + '</span></div>' +
    (opts.notes !== false && e.notes ? '<div class="notes">' + esc(e.notes) + '</div>' : '') +
    (opts.impact !== false && e.impact ? '<div class="imp">' + esc(e.impact) + '</div>' : '') + chips(e.links) + '</div></li>';
}

function start(payload) {
  P = payload; M = Model.load(payload);
  if (STATE.stream && !M.color[STATE.stream]) STATE.stream = '';
  $('stream').innerHTML = '<option value="">All streams</option>' + M.streams.map(function (s) { return '<option>' + esc(s.name) + '</option>'; }).join('');
  var last = M.entries.length ? M.entries[M.entries.length - 1].date : null;
  $('meta').textContent = M.entries.length ? plural(M.entries.length, 'entry', 'entries') + ' since ' + Model.dm(M.entries[0].date) + ' · last logged ' + Model.dm(last) : 'Nothing logged yet';
  $('sheet').hidden = !P.sheet; if (P.sheet) $('sheet').href = P.sheet;
  // the task form: editors only; its lists come from the log as it is now
  $('add-btn').hidden = !P.canEdit;
  $('tab-notes').hidden = !P.canEdit;  // the notepad is the editors' own; viewers are never sent notes
  if (!P.canEdit && STATE.tab === 'notes') STATE.tab = 'overview';
  var opts = function (list, blank) { return (blank ? '<option value="">' + blank + '</option>' : '') + list.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join(''); };
  $('f-stream').innerHTML = opts(M.streams.map(function (s) { return s.name; }), '(none)');
  $('f-kind').innerHTML = opts(Model.KINDS, '(none)');
  $('f-status').innerHTML = opts(Model.STATUSES);
  $('f-projects').innerHTML = M.threads.map(function (t) { return '<option value="' + esc(t.name) + '">'; }).join('');
  var C = P.config || {}, role = [C.title, C.org].filter(Boolean).join(', ');
  $('who').textContent = [C.name, role].filter(Boolean).map(function (s) { return '· ' + s; }).join(' ');
  if (C.name) document.title = 'Receipts · ' + C.name;
  $('warnings').innerHTML = P.warnings.map(function (w) { return '<div class="warn-box">' + esc(w) + '</div>'; }).join('');
  render();
}

// ---------------------------------------------------------------- new task / log update ----------
/** Open the form - empty for a new task, filled from an open project for an update, or from a note (pre.fromNote). */
function openAdd(pre) {
  pre = pre || {};
  STATE.fromNote = pre.fromNote || null;
  $('add-title').textContent = pre.fromNote ? 'Task from a note' : pre.project ? 'Update: ' + pre.project : 'New task';
  $('f-item').value = pre.item || ''; $('f-project').value = pre.project || ''; $('f-stream').value = pre.stream || ''; $('f-kind').value = pre.kind || '';
  $('f-status').value = pre.status || 'Not yet Started'; $('f-date').value = M.asOf; $('f-for').value = pre.who || '';
  $('f-notes').value = pre.notes || ''; $('f-link').value = ''; $('f-msg').textContent = ''; $('f-save').disabled = false;
  var d = $('add-dlg');
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  $('f-item').focus();
}

function closeAdd() { var d = $('add-dlg'); if (d.close) d.close(); else d.removeAttribute('open'); }

function saveTask(e) {
  e.preventDefault();
  var task = { item: $('f-item').value.trim(), project: $('f-project').value.trim(), stream: $('f-stream').value, kind: $('f-kind').value,
    status: $('f-status').value, date: $('f-date').value, 'for': $('f-for').value.trim(), notes: $('f-notes').value.trim(), link: $('f-link').value.trim(),
    fromNote: STATE.fromNote };
  if (!task.item) { $('f-msg').innerHTML = '<span class="err">Give it a name.</span>'; $('f-item').focus(); return; }
  $('f-save').disabled = true; $('f-msg').textContent = 'Saving…';
  google.script.run.withSuccessHandler(function (s) {
    start(JSON.parse(s));
    closeAdd();
    toast('Saved: ' + task.item);
  }).withFailureHandler(function (err) {
    $('f-msg').innerHTML = '<span class="err">' + esc(err.message || err) + '</span>';
    $('f-save').disabled = false;
  }).addTask(JSON.stringify(task));
}

function toast(text) {
  var t = $('toast'); t.textContent = text; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.hidden = true; }, 3500);
}

function setup() {
  $('add-btn').addEventListener('click', function () { openAdd(); });
  $('f-cancel').addEventListener('click', closeAdd);
  $('add-form').addEventListener('submit', saveTask);
  $('now-open').addEventListener('click', function (e) {
    var b = e.target.closest('[data-update]');
    if (!b) return;
    var t = M.threads.filter(function (x) { return x.name === b.dataset.update; })[0];
    openAdd({ project: t.name, stream: t.stream, kind: t.latest.kind, status: t.status, who: t.latest.who });
  });
  // the notepad
  $('n-save').addEventListener('click', addNote);
  $('n-text').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addNote(); } });
  $('n-text').addEventListener('input', function () { draft(this.value); });
  $('n-filter').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { STATE.noteFilter = b.dataset.f; STATE.editing = null; renderNotes(); } });
  $('n-list').addEventListener('click', noteAction);
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { STATE.tab = b.dataset.tab; render(); } });
  $('status').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { STATE.status = b.dataset.s; render(); } });
  $('stream').addEventListener('change', function () { STATE.stream = this.value; render(); });
  $('q').addEventListener('input', function () { STATE.q = this.value; render(); });
  $('st-cards').addEventListener('click', function (e) {
    var c = e.target.closest('[data-stream]');
    if (c) { STATE.stream = c.dataset.stream; STATE.status = ''; STATE.q = ''; $('q').value = ''; STATE.tab = 'timeline'; render(); window.scrollTo(0, 0); }
  });
  $('ov-insights').addEventListener('click', function (e) {
    var a = e.target.closest('[data-go]');
    if (a) { e.preventDefault(); STATE.tab = a.dataset.go; render(); window.scrollTo(0, 0); }
  });
  $('ov-recent').addEventListener('click', function (e) {
    if (!e.target.closest('#ov-more')) return;
    e.preventDefault(); STATE.tab = 'timeline'; STATE.stream = ''; STATE.status = 'Completed'; STATE.q = ''; $('q').value = ''; render(); window.scrollTo(0, 0);
  });
  var t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(function () { if (M && STATE.tab === 'overview') renderOverview(); }, 150); });
}

function render() {
  TABS.forEach(function (t) { $(t).hidden = STATE.tab !== t; });
  [].forEach.call($('tabs').children, function (b) { b.setAttribute('aria-pressed', b.dataset.tab === STATE.tab); });
  [].forEach.call($('status').children, function (b) { b.setAttribute('aria-pressed', b.dataset.s === STATE.status); });
  $('stream').value = STATE.stream;
  $('g-stream').hidden = ['timeline', 'impact', 'outputs'].indexOf(STATE.tab) < 0;
  $('g-status').hidden = $('g-q').hidden = STATE.tab !== 'timeline';
  $('ctl').hidden = $('g-stream').hidden && $('g-status').hidden;
  ({ overview: renderOverview, now: renderNow, timeline: renderTimeline, impact: renderImpact, outputs: renderOutputs, streams: renderStreams, ideas: renderIdeas, notes: renderNotes })[STATE.tab]();
}

// ---------------------------------------------------------------- overview ----------
function renderOverview() {
  var O = Model.overview(M), F = O.facts;
  $('ov-head').innerHTML = 'Where things stand <span class="sub">· week of ' + Model.dm(Model.monday(M.asOf)) + ', as of ' + Model.dm(M.asOf) + '</span>';
  $('ov-sub').textContent = (P.config && P.config.tagline) || 'What is being worked on, what shipped and what it changed - with a link to every deliverable.';
  $('ov-tiles').innerHTML = O.tiles.map(function (t, i) {
    return '<div class="tile" style="--pc:' + ['var(--good)', 'var(--blue)', '#6250d6', 'var(--ink-2)'][i] + '"><div class="k">' + esc(t.k) + '</div><div class="v">' + t.v + '</div><div class="d">' + esc(t.d) + '</div></div>';
  }).join('');
  $('ov-insights').innerHTML = insights(O).map(function (s) { return '<li>' + s + '</li>'; }).join('');
  bars($('ov-weekly'), O.series, O.totals);
  $('ov-open-n').textContent = '· ' + plural(O.open.length, 'project');
  $('ov-open').innerHTML = O.open.length ? O.open.map(function (t) {
    return '<li class="entry"><div class="when">' + Model.dm(t.last) + '</div><div><div class="what">' + esc(t.name) + '</div><div class="meta">' + chip(t.stream) + badge(t.status) +
      '<span class="kind">started ' + Model.dm(t.first) + '</span></div><div class="notes">' + esc(t.note) + '</div></div></li>';
  }).join('') : '<li class="empty">Nothing open.</li>';
  $('ov-recent-n').textContent = '· ' + O.recent.length;
  $('ov-recent').innerHTML = O.recent.length ? O.recent.slice(0, RECENT).map(function (e) { return entry(e, { notes: !e.impact }); }).join('') +
    (O.recent.length > RECENT ? '<li class="empty"><a href="#" id="ov-more">+ ' + (O.recent.length - RECENT) + ' more in the Timeline</a></li>' : '') : '<li class="empty">Nothing shipped in the last 7 days.</li>';
}

/** The facts as sentences - only the ones the data supports. */
function insights(O) {
  var F = O.facts, out = [];
  out.push('<b>' + plural(F.thisWeek, 'thing') + ' shipped this week</b>' + (F.lastWeek || F.thisWeek ? ' (' + F.lastWeek + ' last week)' : '') + '; <b>' + F.month + '</b> in the last 30 days.');
  if (F.perStream.length) out.push('Most of the last 30 days went to ' + F.perStream.slice(0, 3).map(function (s) { return '<b>' + esc(s.stream) + '</b> (' + s.n + ')'; }).join(', ') + '.');
  if (F.bestWeek) out.push('Busiest week so far: <b>' + esc(wk(F.bestWeek.week)) + '</b>, ' + plural(F.bestWeek.n, 'thing') + ' shipped.');
  if (F.oldest) out.push('Longest-running open work: <b>' + esc(F.oldest.name) + '</b>, started ' + ago(F.oldest.age) + '.');
  var L = Model.outputs(M);
  if (L.links) out.push('<b>' + plural(L.links, 'output') + '</b> you can open - sheets, dashboards, decks - under <a href="#" data-go="outputs">Outputs</a>.');
  if (F.quiet.length) out.push('<span class="quiet">No update in a week or more:</span> ' + F.quiet.map(function (t) { return esc(t.name); }).join(', ') + '.');
  return out;
}

// ---------------------------------------------------------------- now ----------
function renderNow() {
  var N = Model.now(M);
  $('now-sub').textContent = '· ' + plural(N.open.length, 'project') + ' open';
  $('now-open').innerHTML = N.open.length ? N.open.map(function (t) {
    return '<div class="card thread" style="--pc:' + M.color[t.stream] + '"><div class="name">' + esc(t.name) + '</div><div class="meta" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">' +
      chip(t.stream) + badge(t.status) + '</div><div class="age">Started ' + Model.dm(t.first) + ' (' + ago(t.age) + ') · ' + plural(t.n, 'update') +
      (t.done ? ', ' + t.done + ' shipped along the way' : '') + ' · last <span class="' + (t.quiet >= 7 ? 'quiet' : '') + '">' + ago(t.quiet) + '</span></div>' +
      '<div class="note">' + esc(t.note) + '</div>' +
      (P.canEdit ? '<div style="margin-top:8px"><button type="button" class="linkbtn" data-update="' + esc(t.name) + '">Log update</button></div>' : '') + '</div>';
  }).join('') : '<p class="empty">Nothing open.</p>';
  $('now-parked-sec').hidden = !N.parked.length;
  $('now-parked').innerHTML = N.parked.map(function (t) { return entry(t.latest); }).join('');
}

// ---------------------------------------------------------------- timeline ----------
function renderTimeline() {
  var G = Model.timeline(M, STATE), n = G.reduce(function (t, g) { return t + g.entries.length; }, 0);
  $('tl-sub').textContent = '· ' + plural(n, 'entry', 'entries') + (STATE.stream ? ' in ' + STATE.stream : '');
  $('tl-weeks').innerHTML = G.length ? G.map(function (g) {
    var shipped = g.entries.filter(function (e) { return e.status === 'Completed'; }).length;
    return '<div class="week"><h3>' + esc(wk(g.week)) + '<span class="sub">' + plural(g.entries.length, 'entry', 'entries') + ', ' + shipped + ' shipped</span></h3>' +
      '<div class="card"><ul class="entries">' + g.entries.map(function (e) { return entry(e); }).join('') + '</ul></div></div>';
  }).join('') : '<p class="empty">No entries match.</p>';
}

// ---------------------------------------------------------------- impact ----------
function renderImpact() {
  var I = Model.impact(M, STATE);
  $('im-sub').textContent = '· ' + plural(I.shipped, 'thing') + ' shipped' + (STATE.stream ? ' in ' + STATE.stream : '');
  $('im-lede').textContent = 'What the completed work delivered, by kind, then each piece\'s one-line "so what" from the impact column.' +
    (I.missing ? ' ' + plural(I.missing, 'shipped entry', 'shipped entries') + ' have no impact line yet.' : '');
  $('im-kinds').innerHTML = I.byKind.map(function (k) {
    return '<div class="tile" style="--pc:var(--blue)"><div class="k">' + esc(k.kind) + '</div><div class="v">' + k.n + '</div><div class="d">across ' + plural(k.projects, 'project') + '</div></div>';
  }).join('');
  $('im-lines').innerHTML = I.lines.length ? I.lines.map(function (e) {
    return '<li class="entry"><div class="when">' + Model.dm(e.date) + '</div><div><div class="what">' + esc(e.impact) + '</div><div class="meta">' + chip(e.stream) +
      '<span class="kind">' + esc(e.kind) + ' · ' + esc(e.project) + (e.who ? ' · for ' + esc(e.who) : '') + '</span></div>' + chips(e.links) + '</div></li>';
  }).join('') : '<li class="empty">No impact lines yet.</li>';
}

// ---------------------------------------------------------------- outputs ----------
function renderOutputs() {
  var O = Model.outputs(M, STATE);
  $('op-sub').textContent = '· ' + plural(O.links, 'link') + ' across ' + plural(O.cards.length, 'project') + (STATE.stream ? ' in ' + STATE.stream : '');
  $('op-types').innerHTML = O.byType.map(function (t) {
    return '<div class="tile" style="--pc:var(--blue)"><div class="k">' + esc(t.type) + '</div><div class="v">' + t.n + '</div></div>';
  }).join('');
  $('op-cards').innerHTML = O.cards.length ? O.cards.map(function (c) {
    return '<div class="card out thread" style="--pc:' + M.color[c.stream] + '"><div class="name">' + esc(c.name) + '</div>' +
      '<div class="meta" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">' + chip(c.stream) + badge(c.status) + '<span class="kind">last ' + Model.dm(c.last) + '</span></div>' +
      (c.impact ? '<div class="imp">' + esc(c.impact) + '</div>' : '') + chips(c.links) + '</div>';
  }).join('') : '<p class="empty">No links logged yet - put them in the log tab\'s link column ("Label | url", one a line).</p>';
}

// ---------------------------------------------------------------- streams ----------
function renderStreams() {
  $('st-cards').innerHTML = Model.streams(M).map(function (s) {
    var max = Math.max.apply(null, s.weekly.concat([1])), n = s.weekly.length, w = 100 / Math.max(n, 1);
    var spark = '<svg viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true">' + s.weekly.map(function (v, i) {
      var h = v ? Math.max(2, 34 * v / max) : 0; return '<rect x="' + (i * w + w * 0.15) + '" y="' + (36 - h) + '" width="' + w * 0.7 + '" height="' + h + '" fill="' + s.color + '"/>';
    }).join('') + '<line x1="0" x2="100" y1="35.5" y2="35.5" stroke="var(--grid)"/></svg>';
    return '<div class="card stream" data-stream="' + esc(s.name) + '" style="--pc:' + s.color + '" role="button" tabindex="0"><h3>' + esc(s.name) + '</h3>' +
      '<div class="about">' + esc(s.about) + '</div><div class="nums"><span><b>' + s.done + '</b>shipped</span><span><b>' + s.done30 + '</b>last 30 days</span><span><b>' + s.open + '</b>open</span></div>' +
      spark + '<div class="ths">' + s.threads.slice(0, 5).map(function (t) { return badge(t.status) + ' ' + esc(t.name); }).join('<br>') + (s.threads.length > 5 ? '<br>+ ' + (s.threads.length - 5) + ' more' : '') + '</div>' +
      (s.impacts.length ? '<ul>' + s.impacts.map(function (e) { return '<li>' + esc(e.impact) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  }).join('');
}

// ---------------------------------------------------------------- notes ----------
var NOTE_FILTERS = ['Open', 'Made a task', 'Archived', 'All'];

function renderNotes() {
  var N = Model.notes(P.notes, STATE.noteFilter);
  if (!$('n-text').value) $('n-text').value = draft();
  $('n-filter').innerHTML = NOTE_FILTERS.map(function (f) {
    return '<button data-f="' + f + '" aria-pressed="' + (f === STATE.noteFilter) + '">' + esc(f) + ' · ' + (N.counts[f] || 0) + '</button>';
  }).join('');
  $('n-list').innerHTML = N.list.length ? N.list.map(function (n) {
    var editing = STATE.editing === n.id;
    return '<div class="card note-card st-' + n.state.replace(/ /g, '-') + '" data-id="' + esc(n.id) + '">' +
      (editing ? '<textarea maxlength="5000" class="n-edit">' + esc(n.text) + '</textarea><div class="crow"><button class="btn" type="button" data-act="save-edit">Save</button>' +
        '<button class="btn ghost" type="button" data-act="cancel-edit">Cancel</button></div>'
        : '<div class="txt">' + esc(n.text) + '</div>') +
      (n.state === 'Made a task' && n.task ? '<div class="tasked">Made a task: ' + esc(n.task) + '</div>' : '') +
      '<div class="when">' + esc(n.created) + (n.updated && n.updated !== n.created ? ' · edited ' + esc(n.updated) : '') + '</div>' +
      (editing ? '' : '<div class="acts">' +
        (n.state !== 'Made a task' ? '<button type="button" class="linkbtn" data-act="task">Make a task</button>' : '') +
        '<button type="button" class="linkbtn" data-act="edit">Edit</button>' +
        (n.state === 'Archived' ? '<button type="button" class="linkbtn" data-act="reopen">Reopen</button>' : '<button type="button" class="linkbtn" data-act="archive">Archive</button>') +
        '</div>') + '</div>';
  }).join('') : '<p class="empty">' + (STATE.noteFilter === 'Open' ? 'No open notes - jot one down above.' : 'Nothing here.') + '</p>';
}

/** A server call that redraws with the payload it returns; fail(message) on an error. */
function call(fn, arg, done, fail) {
  google.script.run.withSuccessHandler(function (s) { start(JSON.parse(s)); if (done) done(); })
    .withFailureHandler(function (e) { if (fail) fail(e.message || String(e)); else toast(e.message || String(e)); })[fn](JSON.stringify(arg));
}

function addNote() {
  var text = $('n-text').value.trim();
  if (!text) { $('n-msg').innerHTML = '<span class="err">Write something first.</span>'; return; }
  $('n-save').disabled = true; $('n-msg').textContent = 'Saving…';
  call('saveNote', { text: text }, function () {
    $('n-text').value = ''; draft(''); $('n-msg').textContent = ''; $('n-save').disabled = false; STATE.noteFilter = 'Open'; renderNotes(); toast('Note saved');
  }, function (m) { $('n-msg').innerHTML = '<span class="err">' + esc(m) + '</span>'; $('n-save').disabled = false; });
}

function noteAction(e) {
  var b = e.target.closest('[data-act]'), card = e.target.closest('[data-id]');
  if (!b || !card) return;
  var id = card.dataset.id, n = Model.notes(P.notes, 'All').list.filter(function (x) { return x.id === id; })[0], act = b.dataset.act;
  if (act === 'task') return openAdd({ fromNote: id, item: n.title, notes: n.rest });
  if (act === 'edit') { STATE.editing = id; renderNotes(); $('n-list').querySelector('textarea').focus(); return; }
  if (act === 'cancel-edit') { STATE.editing = null; renderNotes(); return; }
  if (act === 'save-edit') {
    var text = card.querySelector('textarea').value.trim();
    if (!text) return toast('A note cannot be empty - archive it instead.');
    b.disabled = true;
    return call('saveNote', { id: id, text: text }, function () { STATE.editing = null; renderNotes(); toast('Note updated'); });
  }
  b.disabled = true;
  call('noteState', { id: id, state: act === 'archive' ? 'Archived' : 'Open' }, function () { toast(act === 'archive' ? 'Archived' : 'Reopened'); });
}

/** The unsaved note survives a reload - in this browser only (a convenience; it may be unavailable). */
function draft(v) {
  try {
    if (v === undefined) return localStorage.getItem('receipts-note-draft') || '';
    if (v) localStorage.setItem('receipts-note-draft', v); else localStorage.removeItem('receipts-note-draft');
  } catch (e) { return ''; }
}

// ---------------------------------------------------------------- ideas ----------
function renderIdeas() {
  var I = Model.ideas(M);
  $('id-table').innerHTML = I.length ? '<tr><th>Stream</th><th>Idea</th><th>Status</th></tr>' + I.map(function (r) {
    return '<tr><td>' + chip(r.stream) + '</td><td>' + esc(r.idea) + '</td><td>' + esc(r.status) + '</td></tr>';
  }).join('') : '<tr><td class="empty">No ideas logged - add them to the sheet\'s ideas tab.</td></tr>';
}

// ---------------------------------------------------------------- chart ----------
// Stacked bars, one per week, one colour per stream; hover a week for its split.
function bars(el, series, totals) {
  var used = series.filter(function (s) { return s.counts.some(Boolean); });
  el.querySelector('.legend').innerHTML = used.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.stream) + '</span>'; }).join('');
  var svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  var W = svg.clientWidth || 600, H = svg.clientHeight || 200, L = 26, R = 6, T = 10, B = 22, n = M.weeks.length;
  var max = Math.max.apply(null, totals.concat([1])), step = (W - L - R) / Math.max(n, 1), bw = Math.min(56, step * 0.62);
  var y = function (v) { return T + (H - T - B) * (1 - v / max); }, h = '';
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var ticks = max <= 4 ? Array.from({ length: max + 1 }, function (_, i) { return i; }) : [0, Math.round(max / 2), max];
  ticks.forEach(function (v) { h += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" font-size="10.5" text-anchor="end" fill="var(--text-muted)">' + v + '</text>'; });
  M.weeks.forEach(function (w, i) {
    var x = L + step * i + (step - bw) / 2, acc = 0;
    used.forEach(function (s) {
      var v = s.counts[M.weeks.indexOf(w)];
      if (!v) return;
      h += '<rect x="' + x + '" y="' + y(acc + v) + '" width="' + bw + '" height="' + (y(acc) - y(acc + v)) + '" fill="' + s.color + '" stroke="var(--surface-1)" stroke-width="1"/>';
      acc += v;
    });
    if (totals[i]) h += '<text x="' + (x + bw / 2) + '" y="' + (y(totals[i]) - 4) + '" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink-2)">' + totals[i] + '</text>';
    h += '<text x="' + (x + bw / 2) + '" y="' + (H - 5) + '" font-size="11" text-anchor="middle" fill="var(--text-muted)">' + Model.weekLabel(w).start + '</text>';
    h += '<rect class="hit" data-i="' + i + '" x="' + (L + step * i) + '" y="' + T + '" width="' + step + '" height="' + (H - T - B) + '" fill="transparent"/>';
  });
  svg.innerHTML = h;
  svg.onmousemove = function (e) {
    var r = e.target.closest('.hit'); if (!r) { tip.style.display = 'none'; return; }
    var i = +r.dataset.i, box = svg.getBoundingClientRect();
    tip.innerHTML = esc(wk(M.weeks[i])) + ' · ' + totals[i] + ' shipped' + used.filter(function (s) { return s.counts[i]; }).map(function (s) { return '<br>' + esc(s.stream) + ': ' + s.counts[i]; }).join('');
    tip.style.display = 'block';
    tip.style.left = Math.max(0, Math.min(box.width - 200, (L + step * (i + 0.5)) * box.width / W + 12)) + 'px'; tip.style.top = '34px';
  };
  svg.onmouseleave = function () { tip.style.display = 'none'; };
}
